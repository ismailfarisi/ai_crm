services:
  postgres:
    image: postgres:18-alpine
    container_name: crm_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_staging_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: crm_staging_redis
    restart: unless-stopped
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    container_name: crm_staging_temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PWD: ${DB_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: crm_staging_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env.staging
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:4100:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: crm_staging_web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env.staging
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
      PORT: 3000
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  postgres_staging_data:
  redis_staging_data:
