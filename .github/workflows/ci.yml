name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Enough to satisfy the boot-time env validation; nothing here is a real secret.
  JWT_ACCESS_SECRET: ci_access_secret_at_least_32_characters_long
  JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_characters_long
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USERNAME: crm
  DB_PASSWORD: crm_ci_password
  DB_NAME: crm

jobs:
  # Shared is compiled, not source-linked: both apps consume dist/, so it is
  # built once here and reused rather than rebuilt in every job.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build
      - run: pnpm --filter api build
      - run: pnpm --filter web build
      - uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build
      - run: pnpm test

  # Reported, not enforced. `pnpm lint` currently fails on roughly 300
  # pre-existing errors across the api and web apps, and a check that is red
  # the day it is added teaches everyone to ignore it. Flip this to a blocking
  # step once the backlog is cleared; new code is expected to be clean now.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build
      - run: pnpm lint

  # The rule CLAUDE.md has always stated, now enforced: migrations own the
  # schema. Runs from an empty database so a migration numbered into the wrong
  # band fails here rather than on someone's machine.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: crm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build
      - run: pnpm --filter api build
      - name: Migrate from zero
        run: pnpm migration:run
      # Blocking: new drift fails, the known backlog in scripts/drift-baseline.json does not.
      - name: No new schema drift
        run: pnpm check:drift
      - name: Seed
        run: pnpm seed
      - name: Trial balance sums to zero
        run: pnpm check:books
